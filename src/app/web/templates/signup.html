{% extends "base.html" %}
{% block title %}Create an account{% endblock %}
{% block content %}
<h1>Create an account</h1>
<form method="post" action="/signup" class="narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <label>Display name (shown to organisations you join) <input name="display_name" required maxlength="60" value="{{ display_name or '' }}"></label>
  <label>Email (private, never shared) <input type="email" name="email" required autocomplete="email" value="{{ email or '' }}"></label>
  <label>Password (at least 10 characters) <input type="password" name="password" required minlength="10" autocomplete="new-password"></label>
  <button type="submit">Create account</button>
</form>
<p>Already registered? <a href="/signin">Sign in</a>.</p>
{% endblock %}
