<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>My suggestions</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true">
  <ion-list>
    @for (s of items(); track s.id) {
      <ion-item>
        <ion-label>
          <h3>{{ s.title }}</h3>
          <p>{{ s.org_name }} · revision {{ s.current_revision }}</p>
        </ion-label>
        <ion-note slot="end">{{ label(s.state) }}</ion-note>
      </ion-item>
    } @empty {
      <ion-item><ion-label>No suggestions yet.</ion-label></ion-item>
    }
  </ion-list>
</ion-content>
