<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>Notifications</ion-title>
    <ion-buttons slot="end"><ion-button (click)="readAll()">Mark all read</ion-button></ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true">
  <ion-list>
    @for (n of items(); track n.id) {
      <ion-item [routerLink]="appLink(n)" [button]="appLink(n) !== null" [detail]="false" [class.unread]="!n.read_at">
        <ion-label class="ion-text-wrap">
          <h3 [style.font-weight]="n.read_at ? 400 : 700">{{ n.message }}</h3>
          <p>{{ n.kind }} · {{ n.created_at.slice(0, 16).replace('T', ' ') }} UTC</p>
        </ion-label>
      </ion-item>
    } @empty {
      <ion-item><ion-label>Nothing yet.</ion-label></ion-item>
    }
  </ion-list>
</ion-content>
