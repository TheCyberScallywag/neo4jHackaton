<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>Sign in</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <ion-list inset>
      <ion-item>
        <ion-input label="Email" labelPlacement="stacked" type="email" formControlName="email" autocomplete="username" errorText="Enter a valid email"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Password" labelPlacement="stacked" type="password" formControlName="password" autocomplete="current-password" errorText="Enter the password"></ion-input>
      </ion-item>
    </ion-list>
    <div class="ion-padding-horizontal">
      <ion-button type="submit" expand="block" [disabled]="busy()">Sign in</ion-button>
    </div>
  </form>
  @if (error(); as message) {
    <ion-text color="danger" role="alert"><p class="ion-padding-horizontal">{{ message }}</p></ion-text>
  }
  <ion-note class="ion-padding" color="medium">
    <p>One account for every organisation you volunteer with. Create an account in the web app.</p>
  </ion-note>
</ion-content>
