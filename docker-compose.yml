# Local demo stack:  docker compose up -d --build --wait   (or: uv run task up)
# Host ports default to 8080 (web), 8501 (admin), 8100 (mobile); override with WEB_PORT,
# ADMIN_PORT and MOBILE_PORT if those are taken.
# web and admin share one named volume holding the SQLite database and the writable Relate store.
# On first start the web app copies the bundled read-only data/demo.rl into it and seeds the
# disposable demo accounts. `docker compose down -v` throws it all away.

x-app-env: &app-env
  APP_ENV: test
  DATA_DIR: /data
  ORG_NAMES: ${ORG_NAMES:-}
  API_URL: http://web:8080   # the admin console is a client of the JSON API
  COOKIE_SECURE: ${COOKIE_SECURE:-}
  AURA_URI: ${AURA_URI:-}
  AURA_USERNAME: ${AURA_USERNAME:-neo4j}
  AURA_PASSWORD: ${AURA_PASSWORD:-}
  AURA_DATABASE: ${AURA_DATABASE:-neo4j}

x-health: &health
  interval: 5s
  timeout: 3s
  retries: 24

services:
  web:
    image: dvn/app:local
    build: { context: ., dockerfile: docker/Dockerfile }
    environment:
      <<: *app-env
      SERVICE: web
    ports: ["127.0.0.1:${WEB_PORT:-8080}:8080"]
    volumes: [dvn-data:/data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      <<: *health

  admin:
    image: dvn/app:local
    environment:
      <<: *app-env
      SERVICE: admin
    ports: ["127.0.0.1:${ADMIN_PORT:-8501}:8501"]
    volumes: [dvn-data:/data]
    depends_on: { web: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      <<: *health

  mobile:
    image: dvn/mobile:local
    build: { context: ., dockerfile: docker/mobile.Dockerfile }   # runs lint + unit tests first
    environment:
      API_URL: http://web:8080
    ports: ["127.0.0.1:${MOBILE_PORT:-8100}:8080"]
    depends_on: { web: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      <<: *health

volumes:
  dvn-data:
